spring:
  application:
    name: sinjo

  datasource:
    url: jdbc:mysql://localhost:3306/sinjo?characterEncoding=UTF-8&connectionTimeZone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: false

app:
  cors:
    allowed-origins: http://localhost:5173
  admin:
    email: admin@slangs.com
    password: ${ADMIN_PASSWORD:admin1234!}
    nickname: 관리자

logging:
  level:
    org.hibernate.SQL: debug