spring:
  application:
    name: sinjo

  datasource:
    # PostgreSQL 및 pgvector 연결 설정 (기본 포트 5432)
#    url: jdbc:postgresql://localhost:5432/sinjo?reWriteBatchedInserts=true
    url: jdbc:mysql://localhost:3306/sinjo
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
#    driver-class-name: org.postgresql.Driver
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        # PostgreSQL Dialect 설정
#        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: false

app:
  cors:
    allowed-origins: http://localhost:5173
  admin:
    email: admin@slangs.com
    password: ${ADMIN_PASSWORD:admin1234!}
    nickname: 관리자

logging:
  level:
    org.hibernate.SQL: debug